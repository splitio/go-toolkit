pipeline:
  name: go_toolkit_ci hc
  identifier: go_toolkit_ci_hc
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        repoName: go-toolkit
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: CI
        identifier: CI
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  identifier: test
                  name: Run Tests
                  type: Run
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.18
                    shell: Bash
                    # Tests connect to localhost:6379. Harness Cloud Background steps run
                    # in a separate container (not localhost). Run redis-server inside this
                    # container so tests share the real localhost — matches GHA `services:`.
                    # Pinned to the bullseye/main (non-security) build: bullseye-security has
                    # dropped 6.0.16-1+deb11u9 from its mirror, causing 404s on golang:1.18.
                    command: |-
                      apt-get update -qq && apt-get install -y -qq --no-install-recommends redis-server=5:6.0.16-1+deb11u2 redis-tools=5:6.0.16-1+deb11u2
                      redis-server --daemonize yes
                      for i in $(seq 1 30); do
                        redis-cli ping 2>/dev/null | grep -q PONG && { echo "Redis is up"; break; }
                        echo "Waiting for Redis... ($i/30)"; sleep 1
                      done
                      go mod tidy
                      go test -coverprofile=coverage.out -count=1 -race ./...
